<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Preview — 1200×630</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    .card {
      width: 1200px;
      height: 630px;
      background: linear-gradient(150deg, #FDF6F0 0%, #FAE8E8 60%, #F9E0E0 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .logo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 32px rgba(42,34,32,.15);
      border: 6px solid #fff;
      margin-bottom: 32px;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 58px;
      font-weight: 700;
      color: #2A2220;
      letter-spacing: -.01em;
      line-height: 1;
      margin-bottom: 6px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: #E8A8A8;
      border-radius: 2px;
      margin: 18px auto;
    }

    .tagline {
      font-family: 'Raleway', sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: #C06060;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .location {
      font-family: 'Raleway', sans-serif;
      font-size: 17px;
      font-weight: 400;
      color: #9E9894;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="images/logo.jpg" alt="" class="logo">
    <p class="brand-name">Sissy's Sweets by Em</p>
    <div class="divider"></div>
    <p class="tagline">Custom Cakes &amp; Treats</p>
    <p class="location">Young Harris, Georgia</p>
  </div>
</body>
</html>
